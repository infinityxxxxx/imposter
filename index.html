<title>Imposter</title>
<style>
:root{--bg:#0f1220;--panel:#1b2036;--text:#f2f4ff;--dim:#9aa3c7;--accent:#ff4d6d;--ok:#4dd6a4;--line:#2c3354;--on:#fff}
[data-theme=ocean]{--bg:#06202e;--panel:#0d3347;--text:#eaf8ff;--dim:#8fb8cc;--accent:#14b8e6;--ok:#5eead4;--line:#17506b}
[data-theme=forest]{--bg:#0e1a12;--panel:#17291d;--text:#eefaf0;--dim:#9bbfa4;--accent:#3fb950;--ok:#a3e635;--line:#25402d}
[data-theme=sunset]{--bg:#1f1020;--panel:#33182f;--text:#fff1ea;--dim:#d1a3b0;--accent:#ff7a3d;--ok:#ffd166;--line:#52284a}
[data-theme=grape]{--bg:#150f26;--panel:#241a40;--text:#f5f0ff;--dim:#b3a5d9;--accent:#a855f7;--ok:#f0abfc;--line:#3b2d66}
[data-theme=mono]{--bg:#000;--panel:#161616;--text:#fff;--dim:#9a9a9a;--accent:#fff;--ok:#fff;--line:#2b2b2b;--on:#000}
[data-theme=light]{--bg:#f4f5fb;--panel:#fff;--text:#1a1d2e;--dim:#6b7194;--accent:#e63e5c;--ok:#12a77a;--line:#d9dcee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);transition:background .4s,color .4s;color:var(--text);font:17px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:.2em 0;font-size:2rem}h2{margin:1.2em 0 .4em;font-size:1rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.dim{color:var(--dim)}
.row{display:flex;gap:8px;margin-bottom:8px}
input[type=text],input:not([type]),select,textarea{flex:1;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;color:var(--text);border:0;border-radius:14px;padding:14px;cursor:pointer;transition:transform .12s,filter .2s,opacity .2s,background .3s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35}
.big{width:100%;background:var(--accent);color:var(--on);font-weight:700;font-size:1.1rem;margin-top:16px;box-shadow:0 8px 24px -8px var(--accent)}
button.big:disabled{box-shadow:none}
.ghost{background:var(--panel)}
.link{background:none;color:var(--dim);font-size:.85rem;width:100%;margin-top:8px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats label{background:var(--panel);padding:10px;border-radius:10px;font-size:.9rem;display:flex;gap:8px;align-items:center}
.center{min-height:85vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
.name{font-size:2.6rem;word-break:break-word}
.card{background:var(--panel);border-radius:20px;padding:36px 16px;margin:16px 0;border:2px solid var(--ok)}
.card.imp,h1.imp{color:var(--accent);border-color:var(--accent)}
.card.imp{color:#ff3b3b;border-color:#ff3b3b;background:linear-gradient(160deg,#4a0f14,#2a070a);box-shadow:0 0 22px -4px #ff3b3b}
h1.imp{border:0}
.card.jes,h1.jest{color:#ffd23f}
.card.agt,h1.agent{color:#b98cff}
.card.agt{border-color:#b98cff;background:linear-gradient(160deg,#2a1450,#150a2b);box-shadow:0 0 22px -4px #b98cff}
h1.agent{animation:pop .6s .2s cubic-bezier(.2,.8,.2,1) both}
.card.jes{border-color:#ffd23f;background:linear-gradient(160deg,#3d3208,#211a03);box-shadow:0 0 22px -4px #ffd23f}
h1.jest{animation:pop .6s .2s cubic-bezier(.2,.8,.2,1) both}
.timer{font-size:2.4rem;font-variant-numeric:tabular-nums;margin:12px 0;color:var(--ok)}
.tog{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:14px;border-radius:12px;margin-bottom:8px}
p{margin:.5em 0}
ul.how{list-style:none;padding:0;margin:12px 0 0}
ul.how li{background:var(--panel);border-radius:14px;padding:14px 14px 14px 44px;margin-bottom:10px;position:relative;animation:up .5s ease both;animation-delay:calc(var(--i)*80ms)}
ul.how li::before{content:"";position:absolute;left:16px;top:21px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
/* effects */
.prow{position:relative;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.prow.lift{transition:none;z-index:5;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.prow.new{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.grip{touch-action:none;cursor:grab;padding:12px 10px;color:var(--dim);font-size:1.2rem;line-height:1}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);transition:box-shadow .2s}
.cats label{transition:transform .12s,background .2s}.cats label:active{transform:scale(.97)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateY(-70deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 28px -2px var(--accent)}}
.center>*{animation:up .45s ease backwards}
.center>*:nth-child(2){animation-delay:.08s}.center>*:nth-child(3){animation-delay:.16s}.center>*:nth-child(4){animation-delay:.24s}.center>*:nth-child(5){animation-delay:.32s}
.center>.card{animation:flip .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes redglow{50%{box-shadow:0 0 38px 0 #ff3b3b}}
.card.imp{animation:flip .55s cubic-bezier(.2,.8,.2,1) both,redglow 2s .6s infinite}
h1.imp{animation:pop .6s .1s cubic-bezier(.2,.8,.2,1) both}
.timer.low{color:var(--accent);animation:glow 1s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function ensureAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch { } }
// soft envelope (no clicks); everything scales with S.vol, master capped low so it stays gentle
function tone(f, d, { type = 'sine', vol = 1, slide = 0, delay = 0 } = {}) {
  if (!S.sound || !ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol * S.vol * .35, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, f0, f1, vol = 1, delay = 0) { // filtered noise sweep = whoosh
  if (!S.sound || !ac) return;
  const t = ac.currentTime + delay, n = ac.sampleRate * d | 0, buf = ac.createBuffer(1, n, ac.sampleRate), x = buf.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; fl.type = 'bandpass'; fl.Q.value = 1.2;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol * S.vol * .35, t + d * .6);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(fl); fl.connect(g); g.connect(ac.destination); src.start(t);
}

function deal(names, k, pool) {

  <select onchange="S.time=+this.value">${[[0, 'Off'], [60, '1 min'], [120, '2 min'], [180, '3 min'], [300, '5 min']].map(([v, l]) => `<option value="${v}" ${S.time === v ? 'selected' : ''}>${l}</option>`).join('')}</select>

const TIMES = [0, 60, 120, 180, 300], MODES = ['classic', 'jester', 'different', 'white', 'question', 'super'], CHAOS = [0, .1, .25];
function randomize() { // mode, imposters (1..half the players), timer, categories; players stay as they are
  S.mode = MODES[rand(MODES.length)];
  S.imps = 1 + rand(Math.floor(S.names.length / 2));
  S.time = TIMES[rand(TIMES.length)]; S.chaos = CHAOS[rand(CHAOS.length)];
  S.cats = shuffle(CATS).slice(0, 3 + rand(CATS.length - 2));
  setup();
}
function drag(e, i) { // hold the grip and slide; others glide out of the way, release to drop
  e.preventDefault(); const h = e.currentTarget, rows = [...document.querySelectorAll('.prow')], me = rows[i], n = rows.length;
  const step = n > 1 ? rows[1].getBoundingClientRect().top - rows[0].getBoundingClientRect().top : 0, y0 = e.clientY;
  let to = i; h.setPointerCapture(e.pointerId); me.classList.add('lift'); buzz(10); sfx.tap();

    me.style.transform = `translateY(${dy}px) scale(1.03)`;
    rows.forEach((r, k) => { if (k !== i) r.style.transform = `translateY(${i < t && k > i && k <= t ? -step : i > t && k < i && k >= t ? step : 0}px)`; });

// fast name entry: dictate (or use the keyboard mic / paste); pieces split on commas, "and", new lines
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec;
function bulk(txt = S.names.join('\n')) {
  app.innerHTML = `<header><h1>Player names</h1></header>
  <p class="dim">One name per line, or separate with commas. ${SR ? 'Tap the mic and say the names, pausing between each or saying "and".' : 'Use your keyboard mic to dictate.'} Order here is the pass order.</p>
  ${SR ? '<button class="ghost" id="mic" style="width:100%" onclick="dictate()">🎤 Start dictating</button>' : ''}
  <textarea id="bl" rows="8">${esc(txt)}</textarea>
  <button class="big" onclick="useNames()">Use these names</button>
  <button class="link" onclick="stopRec();setup()">Cancel</button>`;
}
function dictate() {
  if (rec) return stopRec();
  rec = new SR(); rec.continuous = true; rec.interimResults = false; rec.lang = navigator.language || 'en-US';
  rec.onresult = e => { const t = [...e.results].slice(e.resultIndex).map(r => r[0].transcript).join(' ').split(/\s*,\s*|\s+(?:and\s+)?/i).filter(w => w && !/^and$/i.test(w)).join('\n');; /* each spoken word is a name; fix two-word names by hand */ $('#bl').value = ($('#bl').value.trim() ? $('#bl').value.trim() + '\n' : '') + t; };
  rec.onend = () => { rec = null; const m = $('#mic'); if (m) m.textContent = '🎤 Start dictating'; };
  rec.onerror = () => { };
  rec.start(); $('#mic').textContent = '⏹ Listening... tap to stop';
}
function stopRec() { try { rec && rec.stop(); } catch { } rec = null; }
function parseNames(t) { if (!/[,\n]/.test(t)) t = t.replace(/\s+(and\s+)?/gi, ','); return t.split(/[,\n]| and /i).map(x => x.trim().replace(/^and /i, '')).filter(Boolean).map(x => x.slice(0, 14)).slice(0, 12); }
function useNames() {

function add() { S.names.push(`Player ${S.names.length + 1}`); G.added = 1; setup(); G.added = 0; }

function tog(i, on) { const c = CATS[i]; S.cats = on ? [...S.cats, c] : S.cats.filter(x => x !== c); }

function start() {

function pass() {

function hide() { G.i++; if (G.i < G.names.length) sfx.hide(); pass(); }
