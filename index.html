<title>Imposter</title>
<style>
:root{--bg:#0f1220;--panel:#1b2036;--text:#f2f4ff;--dim:#9aa3c7;--accent:#ff4d6d;--ok:#4dd6a4;--line:#2c3354;--on:#fff}

[data-theme=grape]{--bg:#150f26;--panel:#241a40;--text:#f5f0ff;--dim:#b3a5d9;--accent:#a855f7;--ok:#f0abfc;--line:#3b2d66}
[data-theme=mono]{--bg:#000;--panel:#161616;--text:#fff;--dim:#9a9a9a;--accent:#fff;--ok:#fff;--line:#2b2b2b;--on:#000}
[data-theme=light]{--bg:#f4f5fb;--panel:#fff;--text:#1a1d2e;--dim:#6b7194;--accent:#e63e5c;--ok:#12a77a;--line:#d9dcee}

html,body{margin:0;background:var(--bg);transition:background .4s,color .4s;color:var(--text);font:17px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:.2em 0;font-size:2rem}h2{margin:1.2em 0 .4em;font-size:1rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.dim{color:var(--dim)}
.row{display:flex;gap:8px;margin-bottom:8px}
input[type=text],input:not([type]),select{flex:1;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--accent)}

button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35}
.big{width:100%;background:var(--accent);color:var(--on);font-weight:700;font-size:1.1rem;margin-top:16px;box-shadow:0 8px 24px -8px var(--accent)}
button.big:disabled{box-shadow:none}
.ghost{background:var(--panel)}
.link{background:none;color:var(--dim);font-size:.85rem;width:100%;margin-top:8px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats label{background:var(--panel);padding:10px;border-radius:10px;font-size:.9rem;display:flex;gap:8px;align-items:center}
.center{min-height:85vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
.name{font-size:2.6rem;word-break:break-word}
.card{background:var(--panel);border-radius:20px;padding:36px 16px;margin:16px 0;border:2px solid var(--ok)}
.card.imp,h1.imp{color:var(--accent);border-color:var(--accent)}
.card.imp{color:#ff3b3b;border-color:#ff3b3b;background:linear-gradient(160deg,#4a0f14,#2a070a);box-shadow:0 0 22px -4px #ff3b3b}
h1.imp{border:0}
.card.jes,h1.jest{color:#ffd23f}
.card.jes{border-color:#ffd23f;background:linear-gradient(160deg,#3d3208,#211a03);box-shadow:0 0 22px -4px #ffd23f}
h1.jest{animation:pop .6s .2s cubic-bezier(.2,.8,.2,1) both}
.timer{font-size:2.4rem;font-variant-numeric:tabular-nums;margin:12px 0;color:var(--ok)}
.tog{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:14px;border-radius:12px;margin-bottom:8px}
p{margin:.5em 0}
ul.how{list-style:none;padding:0;margin:12px 0 0}
ul.how li{background:var(--panel);border-radius:14px;padding:14px 14px 14px 44px;margin-bottom:10px;position:relative;animation:up .5s ease both;animation-delay:calc(var(--i)*80ms)}
ul.how li::before{content:"";position:absolute;left:16px;top:21px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
/* effects */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateY(-70deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 28px -2px var(--accent)}}
.center>*{animation:up .45s ease backwards}
.center>*:nth-child(2){animation-delay:.08s}.center>*:nth-child(3){animation-delay:.16s}.center>*:nth-child(4){animation-delay:.24s}.center>*:nth-child(5){animation-delay:.32s}
.center>.card{animation:flip .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes redglow{50%{box-shadow:0 0 38px 0 #ff3b3b}}
.card.imp{animation:flip .55s cubic-bezier(.2,.8,.2,1) both,redglow 2s .6s infinite}
h1.imp{animation:pop .6s .1s cubic-bezier(.2,.8,.2,1) both}
.timer.low{color:var(--accent);animation:glow 1s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const WORDS = Object.fromEntries(Object.entries(RAW).map(([k, v]) => [k, v.split(',').map(p => p.split(':').map(s => s.trim()))]));
const CATS = Object.keys(WORDS);
// Question mode: [crew question, imposter question], same category, similar but different.
const QS = {"Cars": [["Which car looks the dumbest?","Which car looks the coolest?"],["What car would you never be caught driving?","What car would you drive across the country?"],["Which car brand has the best logo?","Which car brand has the worst logo?"],["What is the ugliest car color?","What is the best car color?"],["Which car is the loudest?","Which car is the fastest?"]],"Colors": [["What is the dumbest-looking color?","What is the prettiest color?"],["What color do you hate wearing?","What color do you wear the most?"],["Which color is the loudest?","Which color is the calmest?"],["What color would you paint a house you hate?","What color would you paint your bedroom?"],["What is the worst color for a phone case?","What is the best color for a phone case?"]],"Food": [["What is the most overrated food?","What is the most underrated food?"],["Which food smells the worst?","Which food smells the best?"],["What food would you never eat again?","What food could you eat every day?"],["What is the weirdest pizza topping?","What is the best pizza topping?"],["Which snack is the messiest to eat?","Which snack is the hardest to stop eating?"]],"Animals": [["Which animal looks the silliest?","Which animal looks the scariest?"],["What animal would be the worst pet?","What animal would be the best pet?"],["Which animal would lose a race?","Which animal would win a race?"],["What animal makes the funniest sound?","What animal makes the creepiest sound?"],["Which animal is the laziest?","Which animal is the smartest?"]],"Places": [["What is the most boring place to visit?","What is the most fun place to visit?"],["Where would you never want to live?","Where would you most want to live?"],["Which country has the best food?","Which country has the best beaches?"],["Which city is the most overrated?","Which city is the most underrated?"],["What is the worst place to be stuck overnight?","What is the best place to be stuck overnight?"]],"Everyday Life": [["What is the worst school subject?","What is the easiest school subject?"],["What is the most annoying sound?","What is the most relaxing sound?"],["What is the worst chore?","What is the most satisfying chore?"],["What is the most useless thing in your bag?","What is the most useful thing in your bag?"],["What is the dumbest thing to be afraid of?","What is the scariest thing you have seen?"]],"Movies & Music": [["What is the most overrated movie?","What is the best movie you have seen?"],["Which cartoon character is the most annoying?","Which cartoon character would you be?"],["What is the worst movie to watch with family?","What is the best movie to watch with friends?"],["Which superhero has the dumbest power?","Which superhero has the best power?"],["What is the worst song to hear on repeat?","What is the best song for a road trip?"]],"Brands & Tech": [["What is the dumbest-looking logo?","What is the best-looking logo?"],["Which app do you waste the most time on?","Which app could you never delete?"],["What is the most annoying phone notification?","What is the most useful phone feature?"],["Which brand is the most overpriced?","Which brand is the best value?"],["What is the worst video game ever?","What is the best video game ever?"]],"Clothing": [["What is the dumbest-looking piece of clothing?","What is the comfiest piece of clothing?"],["What is the worst hairstyle?","What is the best hairstyle?"],["Which shoes look the silliest?","Which shoes look the best?"],["What is the most uncomfortable thing to wear?","What is the one thing you wear every day?"],["Which hat looks the dumbest?","Which hat looks the coolest?"]]};
const DEF = { names: ['Player 1', 'Player 2', 'Player 3', 'Player 4'], imps: 1, cats: CATS, time: 0, sound: true, vibe: true, vol: .6, theme: 'midnight', mode: 'classic' };

const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let S, G = {}, tick, ac;

function load() { try { return { ...structuredClone(DEF), ...JSON.parse(localStorage.imposter) }; } catch { return structuredClone(DEF); } }
const THEMES = { midnight: 'Midnight', ocean: 'Ocean', forest: 'Forest', sunset: 'Sunset', grape: 'Grape', mono: 'Black & White', light: 'Light' };
function save() { try { localStorage.imposter = JSON.stringify(S); } catch { } }
S = load();
function applyTheme() {
  document.documentElement.dataset.theme = S.theme;
  const m = $('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.body).backgroundColor;
}
applyTheme();

// ---- sound / haptics (WebAudio, no files; AudioContext must be made inside a tap)
function ensureAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch { } }
// soft envelope (no clicks); everything scales with S.vol, master capped low so it stays gentle
function tone(f, d, { type = 'sine', vol = 1, slide = 0, delay = 0 } = {}) {
  if (!S.sound || !ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol * S.vol * .35, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, f0, f1, vol = 1, delay = 0) { // filtered noise sweep = whoosh
  if (!S.sound || !ac) return;
  const t = ac.currentTime + delay, n = ac.sampleRate * d | 0, buf = ac.createBuffer(1, n, ac.sampleRate), x = buf.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; fl.type = 'bandpass'; fl.Q.value = 1.2;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol * S.vol * .35, t + d * .6);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(fl); fl.connect(g); g.connect(ac.destination); src.start(t);
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880];
const bell = (f, delay = 0, len = 1) => { tone(f, .9 * len, { vol: .8, delay }); tone(f * 2.76, .5 * len, { vol: .22, delay }); };
let tapT; // a named sound cancels the pending generic tap blip
const named = fn => (...a) => { clearTimeout(tapT); fn(...a); };
const sfx = {
  tap: () => tone(1200, .04, { vol: .5 }),
  reveal: named(() => { noise(.3, 300, 3000, 2.2); bell(PENTA[rand(PENTA.length)], .22); }), // pitch varies; same for imposter and crew
  hide: named(() => { tone(660, .12, { vol: .6 }); tone(494, .18, { vol: .6, delay: .1 }); }),
  start: named(() => [523.25, 659.25, 783.99].forEach((f, i) => tone(f, .25, { vol: .7, delay: i * .1 }))),
  tick: named(() => tone(900, .03, { type: 'square', vol: .3 })),
  ding: named(() => bell(1320, 0, 1.4)),
  final: named(() => { noise(.9, 200, 2500, 2.4); tone(110, .5, { type: 'triangle', vol: 1.4, slide: 55, delay: .9 }); })
};
document.addEventListener('click', e => { if (e.target.closest('button')) { ensureAudio(); tapT = setTimeout(sfx.tap, 0); } }, true);
function buzz(p) { if (S.vibe && navigator.vibrate) navigator.vibrate(p); } // ponytail: Android only, iOS ignores it

// ---- game logic
function deal(names, k, pool) {
  const [word, hint] = pool[rand(pool.length)];
  const imps = new Set(shuffle(names.map((_, i) => i)).slice(0, k));
  return { names, word, hint, imps, starter: rand(names.length), i: 0 };
}
{ const t = deal(['a', 'b', 'c'], 2, [['w', 'h']]); console.assert(t.imps.size === 2 && t.starter < 3 && t.word === 'w', 'deal broken'); }

// ---- screens
function setup() {
  clearInterval(tick);
  const n = S.names.length, max = S.mode === 'jester' ? n - 2 : n - 1; // jester mode keeps a seat for the Jester
  S.imps = Math.min(Math.max(1, S.imps), max);
  app.innerHTML = `
  <header><h1>Imposter</h1><button class="ghost" onclick="settings()" aria-label="Settings">⚙</button></header>
  <h2>Players (${n})</h2>
  ${S.names.map((x, i) => `<div class="row"><input value="${esc(x)}" maxlength="14" placeholder="Player ${i + 1}" oninput="S.names[${i}]=this.value"><button class="ghost" onclick="rm(${i})" ${n <= 3 ? 'disabled' : ''} aria-label="Remove player">✕</button></div>`).join('')}
  <button class="ghost" style="width:100%" onclick="add()" ${n >= 12 ? 'disabled' : ''}>+ Add player</button>
  <h2>Mode</h2>
  <select onchange="S.mode=this.value;setup()">${[['classic', 'Classic (imposter gets a hint)'], ['jester', 'Jester (classic + a Jester who wants to be voted out)'], ['different', 'Different Word (imposter has a different word)'], ['question', 'Question (everyone answers a question)']].map(([v, l]) => `<option value="${v}" ${S.mode === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
  <h2>Imposters: <b id="ic">${S.imps}</b></h2>
  <input type="range" min="1" max="${max}" value="${S.imps}" oninput="S.imps=+this.value;$('#ic').textContent=this.value">
  <h2>Timer</h2>
  <select onchange="S.time=+this.value">${[[0, 'Off'], [60, '1 min'], [120, '2 min'], [180, '3 min'], [300, '5 min']].map(([v, l]) => `<option value="${v}" ${S.time === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
  ${S.mode === 'question' ? `<h2>Categories</h2><p class="dim">Question mode mixes its own categories: cars, colors, food, animals, places and more.</p>` : `  <h2>Categories</h2>
  <div class="cats">${CATS.map((c, i) => `<label><input type="checkbox" ${S.cats.includes(c) ? 'checked' : ''} onchange="tog(${i},this.checked)">${esc(c)}</label>`).join('')}</div>`}
  <button class="big" onclick="start()">Start Game</button>
  <button class="link" onclick="howto()">How to Play</button>`;
}
function add() { S.names.push(`Player ${S.names.length + 1}`); setup(); }
function rm(i) { S.names.splice(i, 1); setup(); }
function tog(i, on) { const c = CATS[i]; S.cats = on ? [...S.cats, c] : S.cats.filter(x => x !== c); }

function start() {
  const names = S.names.map((x, i) => x.trim() || `Player ${i + 1}`), qm = S.mode === 'question';
  const cats = S.cats.filter(c => WORDS[c]);
  if (!qm && !cats.length) return alert('Pick at least one category.');
  save(); ensureAudio();
  if (qm) { // question mode: "word" is the crew's question, word2 the imposter's, same category
    const cat = Object.keys(QS)[rand(Object.keys(QS).length)];
    G = deal(names, S.imps, QS[cat]); G.word2 = G.hint;
  } else {
    const pool = WORDS[cats[rand(cats.length)]];
    G = deal(names, S.imps, pool);
    // different-word mode: imposter gets another word from the same category and is never told
    if (S.mode === 'different') G.word2 = pool.filter(w => w[0] !== G.word)[rand(pool.length - 1)][0];
    if (S.mode === 'jester') {
      const crew = names.map((_, i) => i).filter(i => !G.imps.has(i)); // the Jester has the crew's word but wants to be voted out
      G.jester = crew[rand(crew.length)];
    }
  }
  G.mode = S.mode;
  pass();
}
function pass() {
  if (G.i >= G.names.length) return started();
  const n = esc(G.names[G.i]);
  app.innerHTML = `<div class="center"><p class="dim">Pass the phone to</p><h1 class="name">${n}</h1><p class="dim">Only ${n} looks. Everyone else, look away.</p><button class="big" onclick="show()">I'm ${n}, show my card</button></div>`;
}
function show() {
  ensureAudio(); sfx.reveal(); buzz(200);
  const twist = G.mode === 'different' || G.mode === 'question', q = G.mode === 'question'; // in different-word/question mode the imposter's card must look like everyone else's
  const imp = G.imps.has(G.i) && !twist, jes = G.mode === 'jester' && G.i === G.jester;
  const w = G.imps.has(G.i) && twist ? G.word2 : G.word;
  app.innerHTML = `<div class="center"><p class="dim">${esc(G.names[G.i])}, your card</p>
  <div class="card ${imp ? 'imp' : jes ? 'jes' : ''}">${jes ? `<h1>JESTER</h1><p class="dim">The word is</p><h2 style="color:inherit;margin:.2em 0;font-size:2rem;text-transform:none;letter-spacing:0">${esc(G.word)}</h2><p>Act suspicious. Get voted out to win!</p>` : imp ? `<h1>IMPOSTER</h1><p>Your hint: <b>${esc(G.hint)}</b></p>` : `<p class="dim">${q ? 'Your question is' : 'The word is'}</p><h1 ${q ? 'style="font-size:1.7rem"' : ''}>${esc(w)}</h1>`}</div>
  <button class="big" id="hb" disabled onclick="hide()">Hide and pass</button></div>`;
  setTimeout(() => { const b = $('#hb'); if (b) b.disabled = false; }, 1200); // a double-tap can't skip the card unseen
}
function hide() { G.i++; if (G.i < G.names.length) sfx.hide(); pass(); }

function started() {
  sfx.start();
  const end = S.time ? Date.now() + S.time * 1000 : 0;
  app.innerHTML = `<div class="center"><h1>Game started</h1><p>${G.mode === 'question' ? 'Everyone answers their question out loud, then talk and catch the imposter. ' : 'Time to talk and catch the imposter. '}<b>${esc(G.names[G.starter])}</b> starts the conversation!</p>
  ${end ? '<div id="t" class="timer"></div>' : ''}
  <button class="big" onclick="reveal()">Reveal Imposter and Word</button>
  <button class="link" onclick="setup()">New Game</button></div>`;
  if (!end) return;
  let lastTick;
  const f = () => {
    const l = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    $('#t').classList.toggle('low', l > 0 && l <= 10);
    $('#t').textContent = l ? `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}` : "Time's up, vote now!";
    if (l && l <= 10 && l !== lastTick) { lastTick = l; sfx.tick(); }
    if (!l) { clearInterval(tick); sfx.ding(); buzz([300, 100, 300, 100, 300]); }
  };
  f(); tick = setInterval(f, 250);
}
function reveal() {
  sfx.final();
  clearInterval(tick);
  const im = [...G.imps].map(i => esc(G.names[i]));
  app.innerHTML = `<div class="center"><p class="dim">${im.length > 1 ? 'The imposters were' : 'The imposter was'}</p><h1 class="imp">${im.join(', ')}</h1>${G.mode === 'jester' ? `<p class="dim">The Jester was</p><h1 class="jest">${esc(G.names[G.jester])}</h1><p class="dim">If the Jester got voted out, the Jester wins!</p>` : ''}
  <p class="dim">${G.mode === 'question' ? 'The question was' : 'The word was'}</p><h1 ${G.mode === 'question' ? 'style="font-size:1.6rem"' : ''}>${esc(G.word)}</h1>${G.mode === 'different' || G.mode === 'question' ? `<p class="dim">The imposter's ${G.mode === 'question' ? 'question' : 'word'} was <b>${esc(G.word2)}</b></p>` : `<p class="dim">Imposter hint: ${esc(G.hint)}</p>`}
  <button class="big" onclick="setup()">New Game</button></div>`;
}

function howto() {
  app.innerHTML = `<header><h1>How to Play</h1></header>
  <ul class="how">${[
    'Gather your friends and pass the phone around.',
    'Each player taps to see their secret word, then hides it and passes the phone on.',
    'One person sees "IMPOSTER" and a hint word instead.',
    'One by one, say a word related to the secret word.',
    'The imposter fakes it and tries to blend in without knowing the word.',
    'Keep giving clues and talking until someone thinks they have figured it out.',
    'Vote for who you think the imposter is, then tap to reveal the truth.'
  ].map((x, i) => `<li style="--i:${i}">${x}</li>`).join('')}</ul>
  <h2>Jester mode</h2>
  <ul class="how">${[
    'Played like Classic, with one extra role: the Jester.',
    'The Jester sees the real word, but secretly wants to be voted out.',
    'The imposter still gets only a hint and tries to blend in.',
    'If the group votes out the Jester, the Jester wins. Vote out the imposter to win as the crew.',
    'The reveal shows both the imposter and the Jester.'
  ].map((x, i) => `<li style="--i:${i}">${x}</li>`).join('')}</ul>
  <h2>Different Word mode</h2>
  <ul class="how">${[
    'Everyone sees a word, and every card looks the same.',
    'The imposter gets a different word from the same category and thinks it is the real one.',
    'Give clues and watch who does not quite fit.',
    'Vote for the imposter. The reveal shows both words.'
  ].map((x, i) => `<li style="--i:${i}">${x}</li>`).join('')}</ul>
  <h2>Question mode</h2>
  <ul class="how">${[
    'Everyone gets a question instead of a word, for example "Which car looks the dumbest?"',
    'The imposter gets a different question from the same category, and does not know it.',
    'Take turns answering your question out loud.',
    'The imposter answers a slightly different question, so their answer feels a little off.',
    'Talk, vote for the imposter, then reveal both questions.'
  ].map((x, i) => `<li style="--i:${i}">${x}</li>`).join('')}</ul>
  <button class="big" onclick="setup()">Back</button>`;
}
function settings() {
  const t = (k, label) => `<div class="tog"><span>${label}</span><input type="checkbox" ${S[k] ? 'checked' : ''} onchange="S.${k}=this.checked;save()"></div>`;
  app.innerHTML = `<header><h1>Settings</h1></header>
  <h2>Theme</h2><select onchange="S.theme=this.value;applyTheme();save()">${Object.entries(THEMES).map(([k, l]) => `<option value="${k}" ${S.theme === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
  <h2>Feedback</h2>${t('sound', 'Sound effects')}${t('vibe', 'Vibration (Android only)')}
  <h2>Volume</h2><input type="range" min="0.1" max="1" step="0.05" value="${S.vol}" oninput="S.vol=+this.value" onchange="save();sfx.tap()">
  <button class="ghost" style="width:100%;margin-top:8px" onclick="if(confirm('Reset names and settings?')){S=structuredClone(DEF);applyTheme();save();setup()}">Reset everything</button>
  <button class="big" onclick="save();setup()">Back</button>`;
}

// block the browser Back button so nobody can navigate to a previous card
history.pushState(null, ''); onpopstate = () => history.pushState(null, '');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
setup();
</script>
</body>
</html>
